name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependencies and CodeQL's own query packs move even when the code does
    # not, so a weekly run catches newly disclosed patterns in unchanged code.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    # Code scanning is free on public repositories but requires a GitHub
    # Advanced Security licence on private ones; without it `analyze` fails
    # at the upload step. This template is commonly instantiated as a
    # private repository (see README.md), so the job only runs there once
    # the destination repository opts in by setting the `GHAS_ENABLED`
    # repository variable to `true`.
    if: github.event.repository.private == false || vars.GHAS_ENABLED == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
