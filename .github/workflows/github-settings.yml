name: GitHub settings

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/github-settings.yml
      - infra/github/**
      - scripts/github-settings.ts
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the declared settings to GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: validate GitHub settings
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.apply == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.1
          cache: true

      - name: Validate desired state
        run: node scripts/github-settings.ts --check

  drift:
    name: detect GitHub settings drift
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.1
          cache: true

      - name: Compare with GitHub
        run: node scripts/github-settings.ts --check --remote

  apply-guard:
    name: validate apply target
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: test "${REF}" = "refs/heads/main"

  apply:
    name: apply GitHub settings
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true && github.ref == 'refs/heads/main'
    needs: apply-guard
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.1
          cache: true

      - name: Apply desired state
        run: node scripts/github-settings.ts --apply
