name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The dependency graph diff this action relies on is free on public
    # repositories but requires a GitHub Advanced Security licence on
    # private ones, where it otherwise fails outright. This template is
    # commonly instantiated as a private repository (see README.md), so the
    # job only runs there once the destination repository opts in by
    # setting the `GHAS_ENABLED` repository variable to `true`.
    if: github.event.repository.private == false || vars.GHAS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocks a PR that introduces a dependency with a known high/critical
      # vulnerability or a disallowed license, evaluated on the diff rather
      # than the whole tree.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
